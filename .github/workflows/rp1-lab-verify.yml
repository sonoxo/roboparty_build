name: RoboParty RP1 Lab Verification

on:
  pull_request:
    paths:
      - "rp1-lab/**"
      - ".github/workflows/rp1-lab-verify.yml"
  push:
    branches: [main]
    paths:
      - "rp1-lab/**"
      - ".github/workflows/rp1-lab-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run deterministic simulation verification
        run: node --test rp1-lab/tests/sim.test.mjs
      - name: Check browser module
        run: node --check rp1-lab/app.mjs
      - name: Check simulation module
        run: node --check rp1-lab/mission-core.mjs
